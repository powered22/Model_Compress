name: llm_experiments
channels:
  - conda-forge
  - defaults
dependencies:
  # ── Core Python ──────────────────────────────────────────────────────────────
  - python=3.11

  # ── Data & numerics ──────────────────────────────────────────────────────────
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=17.0.0
  - numexpr=2.8.7
  - bottleneck=1.3.7

  # ── Dask (parallel / distributed) ────────────────────────────────────────────
  - dask=2025.5.1
  - distributed=2025.5.1
  - fsspec=2024.3.1

  # ── Jupyter stack ────────────────────────────────────────────────────────────
  - jupyter
  - jupyterlab=4.2.5
  - ipykernel=6.29.5
  - ipython=8.27.0
  - ipywidgets=8.1.5
  - notebook=7.2.2
  - widgetsnbextension

  # ── HuggingFace stack ────────────────────────────────────────────────────────
  - datasets=2.19.1
  - huggingface_hub=0.24.6
  - tokenizers=0.20.1
  - transformers=4.45.2
  - safetensors=0.4.5

  # ── LLM clients ──────────────────────────────────────────────────────────────
  - openai=1.37.0

  # ── Validation & utils ───────────────────────────────────────────────────────
  - pydantic=2.8.2
  - requests=2.32.3
  - tqdm=4.66.5
  - nltk=3.9.1
  - pyyaml=6.0.1
  - regex=2024.9.11
  - python-dotenv=0.21.0
  - filelock=3.13.1
  - click=8.1.7
  - packaging=24.1

  # ── Serialisation / IPC ──────────────────────────────────────────────────────
  - dill=0.3.8
  - multiprocess=0.70.15
  - pyzmq=25.1.2

  # ── ML utilities ─────────────────────────────────────────────────────────────
  - joblib=1.4.2

  # ── Visualisation ────────────────────────────────────────────────────────────
  - bokeh=3.7.3

  # ── pip packages ─────────────────────────────────────────────────────────────
  - pip
  - pip:
    # PyTorch with CUDA 12.4 (matches server: Driver 550, CUDA 12.4)
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch==2.7.1+cu124

    # Scientific computing
    - scipy==1.15.3
    - scikit-learn==1.7.0
    - matplotlib==3.10.3
    - plotly==5.24.1
    - numba==0.61.2
    - llvmlite==0.44.0
    - networkx==3.5
    - sympy==1.14.0
    - mpmath==1.3.0

    # Embeddings & NLP evaluation
    - sentence-transformers==4.1.0
    - bert-score==0.3.13
    - rouge-score==0.1.2
    - tiktoken==0.8.0

    # UMAP / dimensionality reduction
    - umap-learn==0.5.7
    - pynndescent==0.5.13

    # Weather / climate data
    - xarray==2025.4.0
    - netcdf4==1.7.2
    - cftime==1.6.4.post1
    - cdsapi==0.7.6
    - ecmwf-datastores-client==0.1.0
    - multiurl==0.3.5
    - isodate==0.7.2

    # Ollama client
    - ollama==0.3.3

    # HTTP / async
    - httpx==0.27.2
    - httpcore==1.0.5
    - anyio==4.6.0
    - sniffio==1.3.1
    - idna==3.10

    # Misc utilities
    - loguru==0.7.3
    - tenacity==9.0.0
    - absl-py==2.3.0
    - fonttools==4.58.4
    - kiwisolver==1.4.8
    - pyparsing==3.2.3
    - threadpoolctl==3.6.0
    - typing-extensions==4.15.0

    # xsdata (XML / data binding)
    - xsdata==26.2
    - xsdata-pydantic==24.5
